# Features - Groups of programs/packages/services that
#            can have additional configuration.
#
# Packages - Anything that is installed via the package
#            manager.
# 
# Programs - Anything program that requires additional
#            configuration. You may also need to specify
#            the package as well, if it is not a NixOS
#            option.
#
# Services - Basically the same as programs, just separated
#            out for (in)convenience.

# ----------------
# --  FEATURES  --
# ----------------
[features.desktop]
programs = [
  "firefox",
  "ghostty",
  "vscode",
]

packages = [
  "thunderbird",
  "slack"
]

[features.developer]
programs = ["git"]
packages = ["asdf-vm"]

[features.gaming]
programs = [
  "steam"
]

packages = [
  "vesktop"
]

[features.laptop]
packages = []

# ---------------
# --   HOSTS   --
# ---------------
[hosts.magnezone]
class = "nixos"
homeConfig = true

features = [
  "desktop",
  "laptop",
  "developer",
  "gaming"
]

programs = []

services = ["sshAgent"]

[hosts.magnezone.plasma]
launcherIcon = "nix-snowflake"

[hosts.Archen]
class = "darwin"
homeConfig = true

features = [
  "developer"
]

packages = [
  "sshpass",
  "ffmpeg_7",
  "yt-dlp",
  "doctl"
]

# special cachyos config
[hosts.duosion]
class = "standalone"
homeConfig = true

features = [
  "desktop",
  "developer",
  "gaming"
]

programs = []
services = []
packages = []

[hosts.duosion.plasma]
launcherIcon = "org.cachyos.hello"

