# Features - Groups of programs/packages/services that
#            can have additional configuration.
#
# Packages - Anything that is installed via the package
#            manager.
# 
# Programs - Anything program that requires additional
#            configuration. You may also need to specify
#            the package as well, if it is not a NixOS
#            option.
#
# Services - Basically the same as programs, just separated
#            out for (in)convenience.

# ----------------
# --  FEATURES  --
# ----------------
[features.desktop]
programs = [
  "firefox",
  "ghostty",
  "vscode",
]

packages = [
  # Applications
  "thunderbird",
  "slack"
]

services = [
  "fonts"
]

[features.desktop-darwin]
programs = [
  "firefox",
  "vesktop",
  "vscode",
]

packages = [
  "slack"
]

[features.developer]
programs = ["git"]
packages = ["asdf-vm"]

[features.gaming]
programs = [
  "steam",
  "vesktop"
]

packages = []

[features.laptop]
packages = []

[features.fonts]
packages = []

# defined but not currently used. needs to be specified somewhere
# or else evaluation fails.
[features.disabled]
programs = [
  "omniwm"
]

# ---------------
# --   HOSTS   --
# ---------------
[hosts.magnezone] # personal nixos laptop
class = "nixos"
homeConfig = true
personal = true
desktopShell = "noctalia"

features = [
  "desktop",
  "laptop",
  "developer",
  "gaming"
]

programs = []

services = [
  "sshAgent"
]
packages = [
  "vlc",
  "xivlauncher"
]

[hosts.magnezone.desktop]
launcherIcon = "nix-snowflake"
wallpaper = "magnezone"

[hosts.Archen] # personal macbook pro
class = "darwin"
homeConfig = true
personal = true

features = [
  "developer",
  "desktop-darwin"
]

programs = [
  "iterm",
  # "omniwm",
  "ghostty"
]

packages = [
  "sshpass",
  "ffmpeg_7",
  "yt-dlp",
  "doctl",
  "vlc-bin",
  "teleport"
]

[hosts.Carbink] # work macbook pro
class = "darwin"
homeConfig = true
personal = false

features = [
  "developer",
  "desktop-darwin"
]

programs = [
  "iterm",
  # "omniwm",
  "ghostty"
]

packages = []

[hosts.duosion] # personal cachyos desktop
class = "standalone"
homeConfig = true
personal = true
desktopShell = "noctalia"

features = [
  "desktop",
  "developer",
  "gaming"
]

programs = []
services = []
packages = []

[hosts.duosion.desktop]
launcherIcon = "org.cachyos.hello"
wallpaper = "duosion"

[hosts.tinkaton] # aur build server
class = "nixos"
homeConfig = true
personal = true

features = ["developer"]

services = ["nginx"]

packages = [
  "yay",
  "gnupg"
]

